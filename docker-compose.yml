version: '3.8'

services:
  phx_weather:
    build:
      context: .
      dockerfile: Dockerfile
    image: phx_weather:latest
    container_name: phx_weather
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - PHX_SERVER=true
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=${PORT:-4000}
      - MIX_ENV=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-4000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
