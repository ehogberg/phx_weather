# Nginx configuration for host nginx (not Docker container)
# Place this in /etc/nginx/sites-available/phx-weather
# Then symlink: sudo ln -s /etc/nginx/sites-available/phx-weather /etc/nginx/sites-enabled/

upstream phx_weather_cluster {
    least_conn;
    server localhost:4001 max_fails=3 fail_timeout=30s;
    server localhost:4002 max_fails=3 fail_timeout=30s;
    server localhost:4003 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name your-domain.com;  # CHANGE THIS to your actual domain

    location / {
        proxy_pass http://phx_weather_cluster;
        proxy_http_version 1.1;

        # Required for WebSocket support (Phoenix LiveView)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for WebSocket connections
        proxy_read_timeout 86400;
    }
}

