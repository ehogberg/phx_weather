version: '3.8'

services:
  phx_weather_1:
    build:
      context: .
      dockerfile: Dockerfile
    image: phx_weather:latest
    container_name: phx_weather_1
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      - PHX_SERVER=true
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=4000
      - MIX_ENV=prod
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=phx_weather_1@phx_weather_1
      - RELEASE_COOKIE=${ERLANG_COOKIE:-phx_weather_cookie_change_me}
      - DNS_CLUSTER_QUERY=phx_weather_1,phx_weather_2,phx_weather_3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - phx_network

  phx_weather_2:
    build:
      context: .
      dockerfile: Dockerfile
    image: phx_weather:latest
    container_name: phx_weather_2
    restart: unless-stopped
    ports:
      - "4002:4000"
    environment:
      - PHX_SERVER=true
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=4000
      - MIX_ENV=prod
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=phx_weather_2@phx_weather_2
      - RELEASE_COOKIE=${ERLANG_COOKIE:-phx_weather_cookie_change_me}
      - DNS_CLUSTER_QUERY=phx_weather_1,phx_weather_2,phx_weather_3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - phx_network

  phx_weather_3:
    build:
      context: .
      dockerfile: Dockerfile
    image: phx_weather:latest
    container_name: phx_weather_3
    restart: unless-stopped
    ports:
      - "4003:4000"
    environment:
      - PHX_SERVER=true
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=4000
      - MIX_ENV=prod
      - RELEASE_DISTRIBUTION=name
      - RELEASE_NODE=phx_weather_3@phx_weather_3
      - RELEASE_COOKIE=${ERLANG_COOKIE:-phx_weather_cookie_change_me}
      - DNS_CLUSTER_QUERY=phx_weather_1,phx_weather_2,phx_weather_3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - phx_network

networks:
  phx_network:
    driver: bridge
