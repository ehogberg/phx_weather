name: Build and deploy to GKE

on:
    push:
        branches:
            - main

env:
    PROJECT_ID: ${{ secrets.GKE_PROJECT_NAME }}
    GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
    GKE_ZONE: ${{ vars.GKE_ZONE }}
    IMAGE: phx-weather-image

jobs:
    setup-build-publish-deploy:
        name: Setup, Build, Publish, and Deploy
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   uses: google-github-actions/setup-gcloud@1bee7de035d65ec5da40a31f8589e240eba8fde5
                with:
                    service_account_key: ${{ secrets.GKE_SA_KEY }}
                    project_id: ${{ secrets.GKE_PROJECT }}
            -   run: |-
                    gcloud --quiet auth configure-docker ${{ env.GKE_ZONE }}-docker.pkg.dev

            -   uses: google-github-actions/auth@v2
                with:
                    credentials_json: ${{ secrets.GKE_SA_KEY }}

            -   uses: google-github-actions/get-gke-credentials@db150f2cc60d1716e61922b832eae71d2a45938f
                with:
                    cluster_name: ${{ env.GKE_CLUSTER }}
                    location: ${{ env.GKE_ZONE }}


            -   name: Build
                run: |-
                    docker build \
                        --tag "$GKE_ZONE-docker.pkg.dev/$PROJECT_ID/$IMAGE:$GITHUB_SHA" \
                        --build-arg GITHUB_SHA="$GITHUB_SHA" \
                        --build-arg GITHUB_REF="$GITHUB_REF" \
                        .
            -   name: Publish
                run: |-
                    docker push "$GKE_ZONE-docker.pkg.dev/$PROJECT_ID/$IMAGE:$GITHUB_SHA"