events {
    worker_connections 1024;
}

http {
    upstream phx_weather {
        least_conn;
        server phx_weather_1:4000 max_fails=3 fail_timeout=30s;
        server phx_weather_2:4000 max_fails=3 fail_timeout=30s;
        server phx_weather_3:4000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://phx_weather;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
